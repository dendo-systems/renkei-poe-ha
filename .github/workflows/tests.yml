name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: custom_components/renkei_poe/tests/requirements.txt
      - run: pip install -r custom_components/renkei_poe/tests/requirements.txt
      - run: python -m pytest
